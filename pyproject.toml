[project]
name = "aesx"
version = "0.1.0"
description = "Classic empirical-aesthetics experiments re-run on vision-language models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "matplotlib>=3.9",
    "scipy>=1.14",
    "pandas>=2.2",
    # local models (exact versions are pinned in uv.lock)
    "torch>=2.6",
    "torchvision",
    "transformers>=5.2",
    "accelerate>=1.1",
    "huggingface-hub",
    "num2words",
]

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aesx"]
